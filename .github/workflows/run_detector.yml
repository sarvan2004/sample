name: Run Detector

on:
  workflow_dispatch:
    inputs:
      detector:
        description: Detector Name
        required: true
        default: emergency

jobs:

  run-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Detector
        run: |
          python main.py ${{ github.event.inputs.detector }}
