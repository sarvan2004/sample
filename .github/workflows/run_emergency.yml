name: Run Emergency Detector

on:
  workflow_dispatch

jobs:

  run-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
            pip install -r requirements.txt

      - name: Install OpenCV
        run: |
          pip install opencv-python

      - name: Verify Repository
        run: |
          pwd
          ls -la

      - name: Run Emergency Script
        run: |
          python Emergency.py
